<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root { --accent:#67e8f9; --panel:rgba(10,16,34,.9); --border:rgba(125,211,252,.25); --text:#e6f1ff; --dim:#93a7c7; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
    body { width:270px; padding:14px; color:var(--text); background:linear-gradient(160deg,#0a1024,#070b16); }
    h1 { font-size:13px; letter-spacing:.16em; display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:11px; margin-bottom:10px; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px; color:var(--dim); padding:3px 0; }
    .st { font-weight:700; }
    .st.on { color:#6ee7b7; } .st.off { color:#f87171; }
    code { font-size:10.5px; color:var(--accent); word-break:break-all; display:block; margin-top:4px; }
    button { width:100%; margin-top:8px; padding:7px 0; border-radius:9px; border:1px solid var(--border);
      background:rgba(103,232,249,.08); color:var(--accent); font-weight:700; font-size:11.5px; letter-spacing:.06em; cursor:pointer; }
    button:hover { background:rgba(103,232,249,.16); }
    .hint { font-size:10.5px; color:var(--dim); line-height:1.5; margin-top:8px; }
  </style>
</head>
<body>
  <h1><span class="dot"></span> ASTRA BRIDGE</h1>
  <div class="card">
    <div class="row"><span>Desktop app</span><span id="status" class="st off">...</span></div>
    <div class="row" style="margin-top:6px"><span>Extension ID</span><button id="copy" style="width:auto;margin:0;padding:4px 10px">Copy</button></div>
    <code id="ext-id">...</code>
  </div>
  <div class="card">
    <div class="row">
      <span>AI Cursor</span>
      <label class="st"><input type="checkbox" id="ai-cursor" checked /> on</label>
    </div>
  </div>
  <p class="hint">Paste this extension ID into ASTRA &rarr; Settings &rarr; Browser, then press "Register Native Messaging Host" and restart Chrome.</p>
  <script src="popup.js"></script>
</body>
</html>
