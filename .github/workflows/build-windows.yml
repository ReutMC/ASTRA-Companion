# ASTRA — Windows installer build (electron-builder → NSIS → ASTRA-Setup.exe)
#
# NOTE on placement: GitHub Actions only reads workflows from the repository
# ROOT `.github/workflows/`. This file lives at `astra/.github/workflows/` so it
# travels with the `astra/` folder (it becomes active if `astra/` is pushed as
# its own repository — in that case remove the `working-directory: astra`
# lines). A synced copy lives at the repo root `.github/workflows/` so CI runs
# in monorepo checkouts too.

name: Build ASTRA-Setup.exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    name: Build & package (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Requires the three lockfiles to be committed (they are produced by
          # `npm run install:all`). If they are missing, delete this block and
          # let npm resolve fresh each run.
          cache: 'npm'
          cache-dependency-path: |
            astra/agent/package-lock.json
            astra/frontend/package-lock.json
            astra/desktop/package-lock.json

      - name: Install dependencies (agent + frontend + desktop)
        working-directory: astra
        run: npm run install:all

      - name: Syntax-check extension + native host (node --check)
        working-directory: astra
        shell: pwsh
        run: |
          node --check browser-extension/background.js
          node --check browser-extension/content.js
          node --check browser-extension/popup.js
          node --check native-host/host.js
          node -e "JSON.parse(require('fs').readFileSync('browser-extension/manifest.json','utf8')); console.log('manifest.json OK')"

      - name: Build (agent → frontend → desktop main)
        working-directory: astra
        run: npm run build

      - name: Package installer (electron-builder / NSIS)
        working-directory: astra
        run: npm run dist:only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ASTRA-Setup.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-Setup
          path: astra/desktop/dist-installer/ASTRA-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach installer to GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: astra/desktop/dist-installer/ASTRA-Setup.exe
          draft: true
          generate_release_notes: true
